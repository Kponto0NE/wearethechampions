<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="image-section">
            <!-- Colocar a minha -->
            <img src="../assets/images/ImagemDeLogin-Login.png" alt="Ilustração de Login">
        </div>

        <div class="form-section">
            <div class="form-content">
                <h1>Login</h1>
                
                <!-- Link para o menu -->
                <form action="portal.html">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Seu e-mail">
                    </div>

                    <!-- Novo bloco para senha com botão de ver -->
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" placeholder="Sua senha">
                            <!-- Ícone de Olho (SVG) -->
                            <span class="toggle-password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="options-row">
                        <a href="recovery.html" class="forgot-link">Esqueceu a senha?</a>
                    </div>

                    <a href="portal.html">
                    <button type="submit" class="btn-login">Conectar</button>
                    </a>

                    <p class="signup-text">
                        Não tem uma conta? <a href="register.html">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
