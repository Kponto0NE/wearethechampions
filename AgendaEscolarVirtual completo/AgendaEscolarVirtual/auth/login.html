<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="image-section">
            <!-- Colocar a minha -->
            <img src="../assets/images/ImagemDeLogin-Login.png" alt="Ilustração de Login">
        </div>

        <div class="form-section">
            <div class="form-content">
                <h1>Login</h1>
                
                 <!-- Link para o menu -->
                <form action="../components/navbar.html">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Seu e-mail">
                    </div>

                    <!-- Novo bloco para senha com botão de ver -->
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" placeholder="Sua senha">
                            <!-- Ícone de Olho (SVG) -->
                            <span class="toggle-password" onclick="togglePasswordVisibility()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="options-row">
                        <!-- Aqui o checkbox foi removido, deixando apenas o link -->
                        <div></div> 
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                    </div>
                    
                    <button type="submit" class="btn-login">Entrar</button>

                    <p class="signup-text">
                        Não tem uma conta? <a href="register.html">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                // Troca o ícone para "olho cortado" (senha visível)
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = "password";
                // Troca o ícone para "olho aberto" (senha oculta)
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }
    </script>

</body>
</html>
